
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's Your Mood?</title>

    <!-- Connects the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>What's Your <span>MOOD?</span></h1>

    <p class="subtitle">THE WORLD'S LEAST ACCURATE MOOD READER</p>

    <p>Let the universe decide your mood...</p>

    <!-- Crystal ball button -->
    <button id="crystal-ball">
        <span>✦</span>
        <p>CLICK ME!</p>
    </button>

    <!-- Mood result appears here -->
    <h2 id="mood"></h2>
    <p id="description"></p>
    <p id="accuracy"></p>

    <button id="try-again" hidden>TRY AGAIN</button>

    <footer>Good vibes only! </footer>

    <!-- Connects the JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
